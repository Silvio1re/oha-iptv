name: Update M3U Playlist

on:
  schedule:
    - cron: '0 */2 * * *'  # Svaka 2 sata
  workflow_dispatch:        # Omogućuje i ručno pokretanje

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: master

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Run M3U generator
      run: |
        python oh.to.py --group Croatia --output oha_channels.m3u
      env:
        WORKER_URL: ${{ secrets.WORKER_URL }}

    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add oha_channels.m3u
        git diff --staged --quiet || git commit -m "Auto-update M3U playlist"
        git push origin master
